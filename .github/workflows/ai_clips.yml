name: AI clips (Kaggle GPU)
on:
  workflow_dispatch:
    inputs:
      download_only:
        description: "Sadece son Kaggle çıktısını indir"
        type: boolean
        default: false
  push:
    paths: ["clips/queue.json"]
permissions:
  contents: write
concurrency:
  group: ai-clips
  cancel-in-progress: false
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Kaggle CLI
        run: |
          pip install -q "kaggle>=1.8"
          kaggle --version
          test -n "$KAGGLE_USERNAME" && test -n "$KAGGLE_API_TOKEN" || (echo "SECRETS MISSING"; exit 1)
      - name: Push kernel
        if: ${{ !inputs.download_only }}
        run: |
          sed -i "s/KAGGLE_USER/$KAGGLE_USERNAME/" kaggle/i2v/kernel-metadata.json
          kaggle kernels push -p kaggle/i2v
      - name: Wait for kernel
        if: ${{ !inputs.download_only }}
        run: |
          K="$KAGGLE_USERNAME/tepe-i2v"
          for i in $(seq 1 300); do
            S=$(kaggle kernels status "$K" 2>&1 | tail -1); echo "$(date +%T) $S"
            case "$S" in *complete*|*COMPLETE*) exit 0;; *error*|*ERROR*|*cancel*|*CANCEL*) echo "KERNEL FAILED"; kaggle kernels output "$K" -p /tmp/klog || true; tail -50 /tmp/klog/*.log 2>/dev/null; exit 1;; esac
            sleep 60
          done
          exit 1
      - name: Download clips
        run: |
          mkdir -p clips/out
          kaggle kernels output "$KAGGLE_USERNAME/tepe-i2v" -p clips/out
          ls -la clips/out
          cat clips/out/log.json || true
          tail -c 3000 clips/out/*.log || true; rm -f clips/out/*.log
      - name: Upscale to 1080x1920 30fps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p clips/hd
          for f in clips/out/*.mp4; do
            b=$(basename "$f" .mp4); [ -f "clips/hd/$b.mp4" ] && continue
            ffmpeg -y -loglevel error -i "$f" -vf "minterpolate=fps=30:mi_mode=mci:mc_mode=aobmc:vsbmc=1,scale=1080:1920:flags=lanczos,unsharp=5:5:0.6" -c:v libx264 -crf 18 -preset medium -pix_fmt yuv420p "clips/hd/$b.mp4"
          done
          ls -la clips/hd
      - name: Commit
        run: |
          git config user.name "reels-bot"; git config user.email "reels-bot@users.noreply.github.com"
          git checkout -- kaggle
          git add clips/out clips/hd
          git diff --cached --quiet && exit 0
          git commit -m "AI clips [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
