name: Render lessons
on:
  push:
    paths: ["lessons/**.json"]
  workflow_dispatch:
    inputs:
      job:
        description: "lessons/xxx.json listesi (boşlukla); boş = son committeki yeni/değişen dersler"
        required: false
permissions:
  contents: write
concurrency:
  group: lessons-${{ github.sha }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.p.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: p
        run: |
          if [ -n "${{ github.event.inputs.job }}" ]; then J="${{ github.event.inputs.job }}";
          else J=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'lessons/*.json'); fi
          echo "jobs=$(printf '%s\n' $J | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')" >> $GITHUB_OUTPUT
  render:
    needs: plan
    if: needs.plan.outputs.jobs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        job: ${{ fromJson(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q pillow
          mkdir -p .fonts
          base=https://github.com/google/fonts/raw/main/ofl
          curl -sL -o .fonts/SchibstedGrotesk.ttf "$base/schibstedgrotesk/SchibstedGrotesk%5Bwght%5D.ttf"
          for f in Lato-Regular Lato-Bold; do curl -sL -o .fonts/$f.ttf "$base/lato/$f.ttf"; done
      - name: Render
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: FONT_DIR=.fonts python3 tools/lesson_render.py "${{ matrix.job }}" | tee render.log
      - name: Upload video to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(python3 -c "import json;print(json.load(open('${{ matrix.job }}'))['code'])")
          gh release view lessons >/dev/null 2>&1 || gh release create lessons --title "Ders videoları" --notes "Online İSG eğitimi ders videoları" || true
          gh release upload lessons "out/lessons/$code.mp4" --clobber
          grep -c UYARI render.log || true
      - name: Commit meta
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          code=$(python3 -c "import json;print(json.load(open('${{ matrix.job }}'))['code'])")
          git add -f "out/lessons/$code.json"
          git commit -m "Render $code [skip ci]" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 10 + 3)); done
